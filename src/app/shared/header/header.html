<header class="relative border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50 bg-white dark:bg-dark-mode-green">

  <!-- Mobile Menu Overlay -->
  @if (appService.openMenu()) {
    <div class="md:hidden absolute w-full left-0 top-full border-t border-b border-gray-200 dark:border-gray-800 shadow-xl bg-white dark:bg-dark-mode-green text-center p-6">
      @for (item of nav; track item.id) {
        <a [href]="'#' + item.id" (click)="handleMobileNavClick()">
          <p class="cursor-pointer my-4 hover:text-green transition-colors duration-200">
            {{ item.name }}
          </p>
        </a>
      }
    </div>
  }

  <div class="flex py-3 md:py-7 max-w-5xl mx-auto px-4 justify-between items-center font-medium">

    <a href="#" class="hover:text-green transition-colors duration-200">
      Tasty
    </a>

    <div class="flex gap-10 items-center">

      @for (item of nav; track item.id) {
        <a
          [href]="'#' + item.id"
          class="text-base hidden md:block hover:text-green transition-colors duration-200"
        >
          {{ item.name }}
        </a>
      }

      <button
        class="cursor-pointer p-1 rounded hover:opacity-70 transition-opacity duration-200"
        (click)="appService.toggleDarkMode()"
        [attr.aria-label]="appService.darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <lucide-icon
          [img]="themeIcon()"
          [size]="22"
          [strokeWidth]="2"
          [class.text-white]="appService.darkMode()"
          [class.text-current]="!appService.darkMode()"
        />
      </button>

      <!-- Mobile Hamburger -->
      <button
        class="md:hidden cursor-pointer p-1 rounded hover:opacity-70 transition-opacity duration-200"
        (click)="appService.toggleMenu()"
        aria-label="Toggle menu"
      >
        <lucide-icon
          [img]="hamburgerIcon()"
          [size]="22"
          [strokeWidth]="2"
          class="text-gray-500"
        />
      </button>

    </div>
  </div>

</header>
